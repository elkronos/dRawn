url: https://elkronos.github.io/dRawn/

template:
  bootstrap: 5
  math-rendering: mathjax

home:
  title: "drawn: design-based sampling with known inclusion probabilities"
  description: >
    Draw probability samples from data frames under a reusable design, then
    estimate totals, means and proportions with the variance estimator the
    design calls for.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Drawing a sample
  desc: One verb, and the designs it takes.
  contents:
  - draw
  - designs
  - plot.drawn_design
  - is_design
  - draw_design

- title: What a design knows before you draw
  desc: The probabilities that make a sample estimable.
  contents:
  - inclusion_prob
  - sampling_weight
  - joint_prob

- title: Estimating from a sample
  desc: >
    Totals, means and proportions, overall or by domain, with the variance
    estimator the design calls for and a design effect.
  contents:
  - ht_total
  - ht_mean
  - deff

- title: Planning and checking
  desc: How many rows to draw, what you actually got, and where to go next.
  contents:
  - plan_size
  - sample_summary
  - as_svydesign

- title: Equal-probability designs
  desc: Every unit equally likely, or equally likely within a group.
  contents:
  - design_simple
  - design_systematic
  - design_stratified
  - design_reservoir

- title: Cluster designs
  desc: Sample groups, then optionally sample within them.
  contents:
  - design_cluster
  - design_multistage

- title: Unequal-probability designs
  desc: Selection driven by size, and units too big to leave to chance.
  contents:
  - design_weighted
  - design_certainty

- title: Space and time
  desc: >
    A sample spread evenly over a map or over covariates, restricted to a
    region, or taken across time intervals.
  contents:
  - design_spread
  - design_spatial
  - design_temporal

- title: Resampling
  contents:
  - design_bootstrap

articles:
- title: Guides
  navbar: Guides
  contents:
  - drawn
  - choosing-a-design
  - articles/estimation

- title: Walkthroughs
  navbar: Walkthroughs
  contents:
  - articles/audit-sampling
  - articles/spatial-sampling
